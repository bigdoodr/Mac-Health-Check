# WKU settings for Mac Health Check
#
# Each line replaces the matching assignment in upstream's Mac-Health-Check.zsh.
#
#   name=value      replaces the single top-level (unindented) line that starts with `name=`
#   name@N=value    replaces the Nth line (indented or not) that starts with `name=`
#                   (used for assignments that sit inside an if/else, like the color scheme)
#
# Write the value exactly as it should appear in the script, quotes included.
# Comments must be on their own lines. The build fails if a name is not found, or if a plain
# name matches more than one top-level line, so an upstream rename can't slip through silently.

# Logging and identity
scriptLog="/private/var/log/edu.wku.mhc.log"
humanReadableScriptName="WKU Mac Health Check"
organizationScriptName="WKU MHC"
reverseDomainNameNotation="edu.wku"

# Branding
organizationSelfServiceMarketingName="Self Service"
organizationBrandingBannerURL="https://www.wku.edu/admissions/images/cherry.jpeg"
organizationOverlayiconURL="https://www.wku.edu/marketingandcommunications/images/wkucuptall.png"
organizationDefaultsDomain="edu.wku.external"
# 1st assignment = Dark Mode, 2nd = Light Mode
organizationColorScheme@1="weight=semibold,colour1=#B01E24,colour2=#000000"
organizationColorScheme@2="weight=semibold,colour1=#333333,colour2=#B01E24"

# Environment
kerberosRealm="ad.wku.edu"
vpnClientVendor="cisco"
vpnClientDataType="basic"
allowedUptimeMinutes="20160"
completionTimer="300"

# IT Support
supportTeamName="WKU ITS"
supportTeamPhone="+1 (270) 745-7000"
supportTeamEmail=""
supportTeamWebsite="https://www.wku.edu/its/contact"
supportKB="4273"
infobuttonaction="https://td.wku.edu/TDClient/34/Portal/KB/Article/${supportKB}"
infobuttontext="About WKU MHC"
supportLabel2=""
supportValue2=""
# 5.x makes the first URL-like support value the dialog's info button. Using the Markdown
# hyperlink here keeps the Website line clickable in the help message while leaving the
# info button pointed at the KB article ("About WKU MHC"), as it was in 4.0.0.
supportValue3="${supportTeamHyperlink}"
